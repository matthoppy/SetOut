# Every push and pull request is checked. A push to main that passes is then
# deployed to staging and asked whether it is healthy.
#
# Production is a separate, manual workflow: deploy-production.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build the designer and the workspace
        run: npm run build

      # The engine's known designs against their known cut lists, and the
      # tests that try to read one company's data from another.
      - name: Test
        run: npm test

  # Deploys need two secrets. Until they are added this says so and stops,
  # so a new repository is not red for a reason that is not a fault.
  deploy-ready:
    name: Are deploys switched on?
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ready: ${{ steps.secrets.outputs.ready }}
    steps:
      - id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Not deployed::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to switch deploys on. See docs/deploying.md."
          fi

  deploy-staging:
    name: Deploy to staging
    needs: [check, deploy-ready]
    if: needs.deploy-ready.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    # One deploy at a time, in the order the pushes were made.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the designer and the workspace
        run: npm run build

      - name: Deploy
        id: deploy
        run: node scripts/deploy.mjs staging

      - name: Ask the deploy whether it is healthy
        run: node scripts/check-deploy.mjs "${{ steps.deploy.outputs.url }}" staging "${{ github.sha }}"
